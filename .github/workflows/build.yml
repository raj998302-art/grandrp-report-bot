name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/GrandRP-ReportBot-v1.2.0.apk
          ls -la output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrandRP-ReportBot-APK
          path: output/GrandRP-ReportBot-v1.2.0.apk
          retention-days: 90

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: GrandRP ReportBot v1.2.0 — Report detection fix (fragmented lines)
          body: |
            Auto-reply bot for Grand RP Mobile admins.

            **v1.2.0 — REPORT DETECTION FIX**
            - FIXED: player reports were skipped because the game renders a report
              line in multiple colors (yellow name / red ID / white message / red counter)
              and Android delivers it as separate text fragments — the bot now
              reassembles those fragments automatically
            - Reports hidden inside one big chat blob (no line breaks) are now detected too
            - Replies are NEVER sent without the reporting player's ID (user's ID only)
            - New overlay **Debug** button: copies the raw screen text the bot sees so
              you can paste it in the dashboard simulator and verify detection
            - Admin-line skip counter now counts unique lines (no rescan inflation)

            **v1.1.0 safety features (still active)**
            - Only genuine player reports (red ID + yellow text, `[Num. of reports: N]`) are answered
            - Admin replies (`<ADM> … has replied to …`) are NEVER answered
            - Your own admin name/ID is never used as a reply target — fill it in ADMIN IDENTITY
            - List of other admin names the bot must never reply to
            - Same report line is never answered twice per session

            **Features**
            - Auto-replies to player reports with admin-style answers ("Greetings, …")
            - Car stuck / flipped → "Use towtruck option"
            - Fuel / skin requests → "We don't provide that such services"
            - RP / NRP name checker built in
            - Anti-AFK: auto-confirms handshake offers from other admins
            - Floating in-game control panel
            - Custom rules via JSON import from the web dashboard

            **Install**: download the APK below, allow "Install from unknown sources" and open it.
          files: output/GrandRP-ReportBot-v1.2.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
