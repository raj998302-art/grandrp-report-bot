name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/GrandRP-ReportBot-v1.1.0.apk
          ls -la output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GrandRP-ReportBot-APK
          path: output/GrandRP-ReportBot-v1.1.0.apk
          retention-days: 90

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: GrandRP ReportBot v1.1.0 — Player reports only (safety update)
          body: |
            Auto-reply bot for Grand RP Mobile admins.

            **v1.1.0 — PLAYER REPORTS ONLY (safety update)**
            - Only genuine player reports (red ID + yellow text, `[Num. of reports: N]`) are answered
            - Admin replies (`<ADM> … has replied to …`) are NEVER answered
            - Your own admin name/ID is never used as a reply target — fill it in ADMIN IDENTITY
            - New: list of other admin names the bot must never reply to
            - Same report line is never answered twice per session
            - Overlay now shows how many admin lines were safely skipped

            **Features**
            - Auto-replies to player reports with admin-style answers ("Greetings, …")
            - Car stuck / flipped → "Use towtruck option"
            - Fuel / skin requests → "We don't provide that such services"
            - RP / NRP name checker built in
            - Anti-AFK: auto-confirms handshake offers from other admins
            - Floating in-game control panel
            - Custom rules via JSON import from the web dashboard

            **Install**: download the APK below, allow "Install from unknown sources" and open it.
          files: output/GrandRP-ReportBot-v1.1.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
